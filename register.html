<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สร้างบัญชี LinkBio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080d;color:#fff;font-family:Inter,system-ui,sans-serif}main{width:min(92vw,430px);padding:30px;border:1px solid #ffffff18;border-radius:24px;background:#ffffff08;backdrop-filter:blur(20px);box-shadow:0 30px 80px #0008}h1{margin:0 0 8px;font-size:28px}p{color:#aaa;margin:0 0 24px;font-size:14px}.grid{display:grid;gap:12px}label{display:grid;gap:7px;font-size:12px;color:#bbb}input{width:100%;padding:13px 14px;border:1px solid #ffffff18;border-radius:12px;background:#0005;color:#fff;outline:none}input:focus{border-color:#a855f7}.btn{margin-top:8px;padding:13px;border:0;border-radius:12px;background:#a855f7;color:#fff;font-weight:700;cursor:pointer}.msg{min-height:20px;margin-top:12px;font-size:12px;color:#f87171}.link{display:block;margin-top:18px;text-align:center;color:#aaa;text-decoration:none;font-size:12px}.link:hover{color:#fff}.hint{font-size:11px;color:#777;margin-top:-4px}
</style>
</head>
<body>
<main>
<h1>สร้างบัญชี LinkBio</h1>
<p>สร้างโปรไฟล์ของคุณ แล้วแชร์ลิงก์ให้เพื่อนได้ทันที</p>
<form id="form" class="grid">
<label>ชื่อที่แสดง<input id="name" maxlength="80" required></label>
<label>Username<input id="username" maxlength="40" pattern="[A-Za-z0-9._-]{2,40}" placeholder="เช่น ice123" required></label>
<div class="hint">ใช้ตัวอักษรอังกฤษ ตัวเลข . _ - เท่านั้น</div>
<label>Email<input id="email" type="email" autocomplete="email" required></label>
<label>รหัสผ่าน<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
<button class="btn" id="submit" type="submit">สร้างบัญชี</button>
</form>
<div id="msg" class="msg"></div>
<a class="link" href="/admin.html">มีบัญชีแล้ว? เข้าสู่ระบบ</a>
</main>
<script>
const $=id=>document.getElementById(id);const form=$('form');
form.addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='กำลังสร้างบัญชี…';try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name:$('name').value,username:$('username').value,email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'สร้างบัญชีไม่สำเร็จ');location.href='/admin.html';}catch(err){$('msg').textContent=err.message}finally{$('submit').disabled=false}});
</script>
</body></html>

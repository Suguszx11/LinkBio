<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก • LinkBio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body data-mode="register"><main class="auth-shell">
<div class="brand"><div class="brand-mark">↗</div><div><div class="eyebrow">CREATE YOUR SPACE</div><b>LinkBio</b></div></div>
<h1 class="title">สร้าง LinkBio ของคุณ ✨</h1><p class="subtitle">สร้างโปรไฟล์ของคุณ แล้วแชร์ลิงก์ เพลง และตัวตนของคุณได้ในหน้าเดียว</p>
<form id="form" class="form"><label class="field">ชื่อที่แสดง<input class="input" id="name" maxlength="80" placeholder="ชื่อของคุณ" required></label>
<label class="field">Username<input class="input" id="username" maxlength="40" pattern="[a-z0-9._-]{2,40}" placeholder="เช่น suguszx" required><span class="hint">ใช้ a-z, 0-9, . _ - เท่านั้น • จะกลายเป็น URL ของคุณ</span></label>
<label class="field">Email<input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
<label class="field">รหัสผ่าน<input class="input" id="password" type="password" autocomplete="new-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร" required></label>
<button class="btn" id="submit" type="submit">สร้างบัญชี</button></form>
<div class="divider">หรือ</div><button class="btn google" id="google" type="button">สมัครด้วย Google</button>
<div id="msg" class="msg"></div><div class="links"><span>มีบัญชีอยู่แล้ว?</span><a href="/login">เข้าสู่ระบบ →</a></div>
<a class="links admin-link" href="/admin.html">สำหรับผู้ดูแลระบบ → เข้าสู่ Admin</a>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth-ui.js?v=20260906-1"></script></body></html>

[build]
publish = "."
functions = "netlify/functions"
command = "npm run build"
`r`n[build.environment]`r`nNODE_VERSION = "20"`r`n
[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/admin.html"
to = "/admin/index.html"
status = 200

[[redirects]]
from = "/admin"
to = "/admin/index.html"
status = 200

[[redirects]]
from = "/dashboard"
to = "/dashboard.html"
status = 200

[[redirects]]
from = "/login"
to = "/login.html"
status = 200

[[redirects]]
from = "/register"
to = "/register.html"
status = 200

[[redirects]]
from = "/profile"
to = "/profile/index.html"
status = 200

# Never let a missing JavaScript/CSS asset fall through to the HTML SPA shell.
[[redirects]]
from = "/*.js"
to = "/404.html"
status = 404

[[redirects]]
from = "/**/*.js"
to = "/404.html"
status = 404

[[redirects]]
from = "/*.css"
to = "/404.html"
status = 404

[[redirects]]
from = "/**/*.css"
to = "/404.html"
status = 404

[[redirects]]
from = "/database/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/server.js"
to = "/404.html"
status = 404

[[redirects]]
from = "/package*.json"
to = "/404.html"
status = 404

[[redirects]]
from = "/.env*"
to = "/404.html"
status = 404

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ LinkBio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080d;color:#fff;font-family:Inter,Prompt,system-ui,sans-serif}.box{width:min(92vw,460px);padding:30px;border:1px solid #ffffff16;border-radius:26px;background:#ffffff08;backdrop-filter:blur(22px);box-shadow:0 30px 100px #0009}h1{margin:0 0 8px}.sub{color:#aaa;font-size:13px;margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#0004;border-radius:14px;margin-bottom:18px}.tabs button,.btn{border:0;border-radius:11px;padding:12px;color:#fff;background:transparent;cursor:pointer}.tabs .on,.btn{background:#a855f7;font-weight:700}.grid{display:grid;gap:11px}label{display:grid;gap:6px;color:#bbb;font-size:12px}input{padding:13px;border:1px solid #ffffff18;border-radius:12px;background:#0005;color:#fff;outline:0}input:focus{border-color:#a855f7}.hint{font-size:11px;color:#777}.msg{min-height:20px;color:#f87171;font-size:12px;margin-top:10px}.google{width:100%;margin-top:10px;border:1px solid #ffffff20;background:#ffffff08}.divider{text-align:center;color:#666;font-size:11px;margin:16px 0}
</style>
</head>
<body><main class="box"><h1>LinkBio</h1><p class="sub">จัดการโปรไฟล์ ลิงก์ และเพลงของคุณ</p>
<div class="tabs"><button id="loginTab" class="on">เข้าสู่ระบบ</button><button id="registerTab">สมัครสมาชิก</button></div>
<form id="form" class="grid"><label id="nameWrap" hidden>ชื่อที่แสดง<input id="name" maxlength="80"></label><label id="usernameWrap" hidden>Username<input id="username" maxlength="40" placeholder="เช่น suguszx"></label><div id="usernameHint" class="hint" hidden>ใช้ a-z, 0-9, _ และ - เท่านั้น</div><label>Email<input id="email" type="email" autocomplete="email" required></label><label>รหัสผ่าน<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="btn" type="submit" id="submit">เข้าสู่ระบบ</button></form>
<div class="divider">หรือ</div><button class="btn google" id="google">เข้าสู่ระบบด้วย Google</button><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/user-auth.js?v=20260906-1"></script>
</body></html>

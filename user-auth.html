<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สร้างบัญชี LinkBio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#25133b 0,#0c0912 38%,#06060a 100%);color:#fff;font-family:Prompt,Inter,system-ui,sans-serif}.box{width:min(92vw,460px);padding:32px;border:1px solid #ffffff18;border-radius:26px;background:#ffffff0a;backdrop-filter:blur(24px);box-shadow:0 30px 100px #000b}h1{margin:0 0 8px;font-size:30px;letter-spacing:-.5px}.sub{color:#aaa;font-size:13px;margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#0005;border-radius:14px;margin-bottom:18px}.tabs button,.btn{border:0;border-radius:11px;padding:12px;color:#fff;background:transparent;cursor:pointer;font-family:inherit}.tabs .on,.btn{background:#a855f7;font-weight:700}.grid{display:grid;gap:11px}label{display:grid;gap:6px;color:#bbb;font-size:12px}input{width:100%;padding:13px;border:1px solid #ffffff18;border-radius:12px;background:#0005;color:#fff;outline:0;font-family:inherit}input:focus{border-color:#a855f7;box-shadow:0 0 0 3px #a855f71a}.hint{font-size:11px;color:#777}.msg{min-height:20px;color:#f87171;font-size:12px;margin-top:10px}.google{width:100%;margin-top:10px;border:1px solid #ffffff20;background:#ffffff08}.divider{text-align:center;color:#666;font-size:11px;margin:16px 0}.back{display:block;text-align:center;margin-top:18px;color:#999;font-size:12px;text-decoration:none}.back:hover{color:#fff}
</style>
</head>
<body><main class="box"><h1>สร้างบัญชี LinkBio</h1><p class="sub">สร้างโปรไฟล์ของคุณ แล้วแชร์ลิงก์ให้เพื่อนได้ทันที</p>
<div class="tabs"><button id="loginTab" class="on">เข้าสู่ระบบ</button><button id="registerTab">สมัครสมาชิก</button></div>
<form id="form" class="grid"><label id="nameWrap" hidden>ชื่อที่แสดง<input id="name" maxlength="80"></label><label id="usernameWrap" hidden>Username<input id="username" maxlength="40" placeholder="เช่น suguszx"></label><div id="usernameHint" class="hint" hidden>ใช้ a-z, 0-9, _ และ - เท่านั้น</div><label>Email<input id="email" type="email" autocomplete="email" required></label><label>รหัสผ่าน<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="btn" type="submit" id="submit">เข้าสู่ระบบ</button></form>
<div class="divider">หรือ</div><button class="btn google" id="google">เข้าสู่ระบบด้วย Google</button><div id="msg" class="msg"></div><a class="back" href="/admin.html">สำหรับผู้ดูแลระบบ → เข้าสู่ Admin</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/user-auth.js?v=20260906-1"></script>
</body></html>
